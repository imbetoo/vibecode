<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Clase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <script src="theme.js"></script>
  <main id="app" class="app">
    <!-- Vista 1: menú principal -->
    <section id="menu-view" class="view view--menu" aria-label="Menú principal">
      <header class="menu-header">
        <div>
          <h1 class="menu-title">Clase</h1>
          <p id="menu-date" class="menu-date"></p>
        </div>
        <button class="toolbar-button toolbar-button--icon js-toggle-theme" type="button" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
        </button>
      </header>

      <div class="menu-buttons">
        <button id="open-schedule" class="menu-button menu-button--schedule" type="button">
          <span class="menu-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4.5" width="18" height="16.5" rx="4"/>
              <path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
            </svg>
          </span>
          <span class="menu-button__text">
            <span class="menu-button__title">Horario</span>
            <span id="menu-summary" class="menu-button__subtitle"></span>
          </span>
          <span class="menu-button__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </button>

        <div id="ipe-card" class="menu-button menu-button--card menu-button--ipe">
          <span class="menu-button__icon menu-button__icon--ipe" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6.5 3h11M6.5 21h11"/>
              <path d="M7.5 3v3.2a4 4 0 0 0 1.6 3.2L12 12l2.9-2.6a4 4 0 0 0 1.6-3.2V3"/>
              <path d="M7.5 21v-3.2a4 4 0 0 1 1.6-3.2L12 12l2.9 2.6a4 4 0 0 1 1.6 3.2V21"/>
            </svg>
          </span>
          <span class="menu-button__text">
            <span class="menu-button__title">Entrega IPE</span>
            <span id="ipe-countdown-text" class="menu-button__subtitle"></span>
          </span>
          <span class="menu-button__aside">
            <svg class="ipe-clock" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <mask id="ipe-clock-hands">
                <circle cx="12" cy="12" r="11" fill="#fff"/>
                <path d="M12 6.5V12l3.5 2.5" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </mask>
              <circle cx="12" cy="12" r="11" fill="currentColor" mask="url(#ipe-clock-hands)"/>
            </svg>
            <input id="ipe-check" class="task__check" type="checkbox" aria-label="Marcar la tarea de IPE de esta semana como entregada" title="Marcar como entregada">
          </span>
        </div>

        <button id="open-tasks" class="menu-button menu-button--tasks" type="button">
          <span class="menu-button__icon menu-button__icon--tasks" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="4" y="3.5" width="16" height="17.5" rx="3.5"/>
              <path d="M8.5 9.5l1.5 1.5 3-3M8.5 15.5h7"/>
            </svg>
          </span>
          <span class="menu-button__text">
            <span class="menu-button__title">Tareas Aula Virtual</span>
            <span class="menu-button__subtitle">Entregas del AV</span>
          </span>
          <span class="menu-button__chevron" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
          </span>
        </button>

        <button class="menu-button menu-button--soon" type="button" disabled>
          <span class="menu-button__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
            </svg>
          </span>
          <span class="menu-button__text">
            <span class="menu-button__title">Próximamente...</span>
            <span class="menu-button__subtitle">Nuevas funciones en camino</span>
          </span>
        </button>
      </div>
    </section>

    <!-- Vista 2: horario diario -->
    <section id="schedule-view" class="view view--schedule" aria-label="Horario diario" inert>
      <div class="toolbar">
        <button class="toolbar-button js-back-to-menu" type="button" title="Volver al menú">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          Menú
        </button>
        <div class="toolbar-group">
          <button class="toolbar-button toolbar-button--icon js-toggle-theme" type="button" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          </button>
          <button id="open-full" class="toolbar-button toolbar-button--icon" type="button" title="Abrir horario completo" aria-label="Abrir horario completo">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          </button>
        </div>
      </div>

      <header class="day-header">
        <button id="prev-day" class="day-nav day-nav--prev" type="button">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          <span id="prev-label" class="day-nav__label"></span>
        </button>
        <div class="day-pill-wrap">
          <h2 id="day-title" class="day-pill"></h2>
          <span class="day-pill-bar" aria-hidden="true"></span>
        </div>
        <button id="next-day" class="day-nav day-nav--next" type="button">
          <span id="next-label" class="day-nav__label"></span>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </header>

      <div id="day-grid" class="day-grid" aria-live="polite"></div>
    </section>

    <!-- Vista 3: tareas del Aula Virtual (calendario .ics de Moodle) -->
    <section id="tasks-view" class="view view--tasks" aria-label="Tareas del Aula Virtual" inert>
      <div class="toolbar">
        <button class="toolbar-button js-back-to-menu" type="button" title="Volver al menú">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
          Menú
        </button>
        <div class="toolbar-group">
          <button id="tasks-settings" class="toolbar-button toolbar-button--icon" type="button" title="Cambiar o borrar el enlace del calendario" aria-label="Cambiar o borrar el enlace del calendario" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <button class="toolbar-button toolbar-button--icon js-toggle-theme" type="button" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">
            <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          </button>
        </div>
      </div>

      <header class="tasks-header">
        <h2 class="tasks-title">Tareas</h2>
        <p id="tasks-status" class="tasks-status" aria-live="polite"></p>
      </header>

      <form id="tasks-setup" class="tasks-setup" hidden>
        <label for="ics-url" class="tasks-label">Enlace del calendario de Moodle (.ics)</label>
        <input id="ics-url" class="tasks-input" type="url" required placeholder="https://…/calendar/export_execute.php?…" autocomplete="off" spellcheck="false">
        <p class="tasks-hint">En el Aula Virtual: Calendario → Exportar calendario → Obtener URL del calendario.</p>
        <div class="tasks-actions">
          <button type="submit" class="tasks-button tasks-button--primary">Guardar</button>
          <button id="ics-cancel" type="button" class="tasks-button" hidden>Cancelar</button>
          <button id="ics-clear" type="button" class="tasks-button tasks-button--danger" hidden>Borrar enlace</button>
        </div>
      </form>

      <ul id="tasks-list" class="tasks-list" hidden></ul>
    </section>
  </main>

  <script src="schedule-data.js"></script>
  <script src="ipe.js"></script>
  <script src="moodle.js"></script>
  <script src="popup.js"></script>
</body>
</html>
