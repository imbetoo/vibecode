<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bSTG</title>
  <style>
    :root {
      --bg: #1c2736;
      --surface: #243244;
      --surface-2: #2c3c51;
      --border: #34465d;
      --text: #e6edf5;
      --muted: #93a4b8;
      --accent: #6ec6f5;
      --accent-text: #0f1b28;
      --ok: #7ed957;
      --danger: #f4a0a0;
      --radius: 10px;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --surface-2: #eef2f7;
        --border: #d6dee8;
        --text: #1c2736;
        --muted: #5d6f85;
        --accent: #1f8fd1;
        --accent-text: #ffffff;
        --ok: #2f9e44;
        --danger: #d9485f;
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 340px;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px 10px;
    }
    header img { width: 28px; height: 28px; border-radius: 7px; }
    header h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: .2px; }
    header p { margin: 0; color: var(--muted); font-size: 11.5px; }

    main { padding: 0 16px 14px; }

    form {
      display: grid;
      gap: 8px;
      padding: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    label { display: grid; gap: 4px; font-size: 11.5px; color: var(--muted); font-weight: 550; }

    input {
      width: 100%;
      padding: 7px 9px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    input[aria-invalid="true"] { border-color: var(--danger); }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 7px;
      transition: filter .15s, background-color .15s;
    }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .primary {
      padding: 8px 12px;
      border: 0;
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 650;
    }
    .primary:hover { filter: brightness(1.08); }

    .status { min-height: 17px; margin: 0; font-size: 11.5px; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.error { color: var(--danger); }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin: 14px 2px 6px;
      font-size: 11.5px;
      font-weight: 650;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
    }

    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 240px; overflow-y: auto; }

    li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .rule { flex: 1; min-width: 0; cursor: pointer; }
    .rule-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rule-domain { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .delete {
      flex: none;
      padding: 4px 9px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--danger);
      font-size: 12px;
    }
    .delete:hover { background: color-mix(in srgb, var(--danger) 14%, transparent); }

    .empty {
      padding: 14px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 14px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11.5px;
    }

    .secondary {
      flex: none;
      white-space: nowrap;
      padding: 5px 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    .secondary:hover { background: var(--surface-2); }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon_48.png" alt="">
    <div>
      <h1>bSTG</h1>
      <p>Nombres personalizados para tus grupos</p>
    </div>
  </header>

  <main>
    <form id="rule-form" novalidate>
      <label>
        Dominio
        <input id="domain" name="domain" type="text" placeholder="github.com"
               autocomplete="off" spellcheck="false" required>
      </label>
      <label>
        Nombre del grupo
        <input id="name" name="name" type="text" placeholder="Desarrollo"
               autocomplete="off" maxlength="40" required>
      </label>
      <button type="submit" class="primary" id="save">Guardar</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>

    <div class="section-title">
      <span>Reglas guardadas</span>
      <span id="count"></span>
    </div>
    <ul id="rules" aria-label="Reglas guardadas"></ul>
    <p id="empty" class="empty" hidden>Aún no hay reglas. Los grupos usan el nombre del dominio.</p>
  </main>

  <footer>
    <span>Cada regla cubre también sus subdominios.</span>
    <button type="button" class="secondary" id="regroup" title="Reorganizar las pestañas de todas las ventanas">Reagrupar ahora</button>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
